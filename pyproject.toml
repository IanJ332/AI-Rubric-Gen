[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-benchmark"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["rubric_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
